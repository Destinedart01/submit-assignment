<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Assignment Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Assignment Portal</h1>
    <p class="sub">Sign in to submit, grade, or manage assignments.</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" class="primary" style="width:100%;">Sign in</button>
    </form>

    <div id="msg" class="msg" style="display:none;"></div>

    <div class="auth-links">
      New student? <a href="register.html">Create an account</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
