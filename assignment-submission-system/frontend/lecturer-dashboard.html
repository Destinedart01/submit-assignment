<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturer Dashboard — Assignment Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <h1 class="brand">Assignment Portal</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="role-tag">LECTURER</span>
      <button onclick="logout()">Log out</button>
    </div>
  </div>

  <div class="wrap">
    <div class="tabs">
      <button class="tab-btn active" data-tab="assignments">My Assignments</button>
      <button class="tab-btn" data-tab="submissions">Submissions & Grading</button>
      <button class="tab-btn" data-tab="results">Enter Results</button>
    </div>

    <div id="msg" class="msg" style="display:none;"></div>

    <!-- Assignments -->
    <div class="tab-panel panel" id="tab-assignments">
      <h2>Create Assignment</h2>
      <form id="assignmentForm">
        <label>Course unit</label>
        <select id="unitSel" required></select>
        <label>Title</label>
        <input type="text" id="title" required>
        <label>Instructions</label>
        <textarea id="instructions"></textarea>
        <label>Due date</label>
        <input type="datetime-local" id="dueDate" required>
        <button class="primary" type="submit">Create assignment</button>
      </form>

      <h2 style="margin-top:28px;">My Assignments</h2>
      <table>
        <thead><tr><th>Title</th><th>Course Unit</th><th>Due</th></tr></thead>
        <tbody id="assignmentTable"></tbody>
      </table>
    </div>

    <!-- Submissions -->
    <div class="tab-panel panel" id="tab-submissions" style="display:none;">
      <h2>View Submissions</h2>
      <label>Select assignment</label>
      <select id="submissionAssignmentSel"></select>
      <table>
        <thead><tr><th>Student</th><th>Student No</th><th>Text</th><th>File</th><th>Grade</th><th></th></tr></thead>
        <tbody id="submissionTable"></tbody>
      </table>
    </div>

    <!-- Results -->
    <div class="tab-panel panel" id="tab-results" style="display:none;">
      <h2>Enter Result</h2>
      <form id="resultForm">
        <label>Course unit</label>
        <select id="resultUnitSel" required></select>
        <label>Student number</label>
        <input type="text" id="resultStudentNo" required placeholder="e.g. FPI/CIT/2024/001">
        <div class="field-row">
          <div><label>Coursework score</label><input type="number" step="0.01" id="courseworkScore" required></div>
          <div><label>Exam score</label><input type="number" step="0.01" id="examScore" required></div>
        </div>
        <button class="primary" type="submit">Save result</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/lecturer.js"></script>
</body>
</html>
